  <g transform="translate(184 138)">
    <rect width="200" height="140" rx="12" fill="#8f5bff" opacity="0.16" stroke="#8f5bff" stroke-width="2" stroke-opacity="0.55" />
  </g>
  <g transform="translate(220 164)">
    <rect width="200" height="140" rx="12" fill="url(#accent)" opacity="0.9" />
    <path d="M62 96V44h22a18 18 0 0 1 0 36h-12v16z" fill="#0e1016" opacity="0.75" />
    <rect x="104" y="44" width="26" height="52" rx="7" fill="#0e1016" opacity="0.45" />
  </g>

  <text x="320" y="352" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#8c93ad">
