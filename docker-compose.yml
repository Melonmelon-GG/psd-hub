# =============================================================================
# PSD 展示台 · Docker Compose 部署
#
# 最简用法（只用应用容器 + 宿主机上的 Nginx / Cloudflare 等）：
#     cp deploy/env.example .env      # 按需改端口与令牌
#     docker compose up -d --build
#     open http://127.0.0.1:4000
#
# 一体化用法（额外起一个自带配置的 Nginx）：
#     docker compose --profile edge up -d --build
#     open http://127.0.0.1
#
# 校验 compose 文件：docker compose config
# =============================================================================

name: psd-hub

services:
  psd-hub:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        # 挂在子路径下时（例如 https://7thcv.cn/psd/）设为 /psd/ 与 /psd
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: ${PSD_HUB_IMAGE:-psd-hub}:${PSD_HUB_VERSION:-1.0.0}
    container_name: psd-hub-app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # 镜像内已经有一份默认值，这里只做「显式覆盖点」，方便运维一眼看清可调项
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      DATA_DIR: /data
      SERVE_STATIC: "true"
      STATIC_DIR: /app/public
      TRUST_PROXY: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # --- v2.1 主站登录接入 ---
      # 主站基址；留空 = 不启用登录（本地开发时上传不需要登录）
      MAIN_SITE_BASE_URL: ${MAIN_SITE_BASE_URL:-}
      # 用来校验令牌的「成员专属」接口（服务端会带用户的 Authorization 去调它）
      MAIN_SITE_VERIFY_PATH: ${MAIN_SITE_VERIFY_PATH:-/api/kb/tree}
      # 挂载前缀：设为 /psd 即把整个应用挂在 https://<域名>/psd/ 下
      MOUNT_PREFIX: ${MOUNT_PREFIX:-}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

    # 默认只绑定回环地址：由宿主机 Nginx / 网关对外提供服务。
    # 需要直接对外暴露时在 .env 里设 PSD_HUB_BIND=0.0.0.0
    ports:
      - "${PSD_HUB_BIND:-127.0.0.1}:${PSD_HUB_PORT:-4000}:4000"

    volumes:
      # 所有 PSD / PNG / db.json 都在这里，务必备份
      - psd-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # 上传大 PSD 时容器内的临时文件也会变大，放宽 nofile
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # ---------------------------------------------------------------------------
  # 可选：自带配置的 Nginx 反向代理（docker compose --profile edge up -d）
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: psd-hub-nginx
    restart: unless-stopped
    profiles: ["edge"]
    depends_on:
      psd-hub:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/psd-hub.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 可选：Let's Encrypt 证书自动签发/续期（docker compose --profile tls run --rm certbot）
  # 使用前请先在 .env 里设置 DOMAIN 与 LETSENCRYPT_EMAIL
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: psd-hub-certbot
    profiles: ["tls"]
    volumes:
      - ./deploy/nginx/certs:/etc/letsencrypt
      - ./deploy/nginx/www:/var/www/certbot
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
      -d ${DOMAIN:-example.com}
      --email ${LETSENCRYPT_EMAIL:-admin@example.com}
      --agree-tos --no-eff-email --non-interactive"

volumes:
  psd-data:
    driver: local
  nginx-cache:
    driver: local
