# =============================================================================
# PSD 展示台 · Nginx 反向代理配置
#
# 两种用法：
#   1) Docker（docker compose --profile edge）：直接把这个文件挂到
#      /etc/nginx/conf.d/default.conf，upstream 指向容器名 psd-hub:4000。
#   2) 裸机（systemd / pm2）：把这个文件放到 /etc/nginx/conf.d/psd-hub.conf，
#      并把下面 upstream 的 server 改成 127.0.0.1:4000。
#
# 关键点：v2.0 起站内只上传 PNG 展示图（几百 KB 级），请求体限制可以收得很紧。
# 下面仍保留关闭请求体缓冲的配置 —— 它在大图/慢网络下依然有价值，
# 且将来若恢复「上传源文件」的路线，不必再动这份配置。
# =============================================================================

upstream psd_hub_backend {
    server psd-hub:4000;          # 裸机部署请改为 127.0.0.1:4000
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    server_tokens off;

    # --- 请求体上限：必须 >= 后端 MAX_UPLOAD_MB（v2.0 只传 PNG，32m 已有充足余量）---
    client_max_body_size    32m;
    client_body_timeout     600s;
    client_body_buffer_size 1m;

    # 上传/下载时不在 Nginx 侧落盘缓冲，直接流式透传
    proxy_request_buffering off;
    proxy_buffering         off;
    proxy_connect_timeout   30s;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    send_timeout            600s;

    # --- 压缩 ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      text/javascript image/svg+xml application/wasm;

    # --- 存活探针（不转发到后端，避免探针污染后端日志）---
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- 带内容哈希的前端静态资源：一年不可变缓存 ---
    # 注意：nginx 的 add_header 在 location 内会「覆盖」外层同名指令，
    # 所以安全头需要在这里重复一遍。
    location /assets/ {
        proxy_pass         http://psd_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # --- 其余全部交给后端（API + SPA 回退）---
    location / {
        proxy_pass         http://psd_hub_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # 让浏览器始终拿到最新的 index.html，避免发版后白屏
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # 后端会自己给 /assets 之外的东西发 Cache-Control，这里不覆盖
        proxy_hide_header X-Powered-By;
    }
}
